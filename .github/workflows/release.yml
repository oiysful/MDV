name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build -- --publish=never

      - name: Generate checksums
        run: shasum -a 256 MDV-*.zip > SHA256SUMS
        working-directory: dist

      # Pinned to a commit, not a tag: this third-party action runs on the same runner as the zip,
      # SHA256SUMS and the tap step below, so a moved tag could swap the artifact and its hash together
      # (security-report.md M1, 2026-10-12). Bump by resolving the new tag to its commit on purpose.
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/MDV-*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256="$(awk '{ print $1 }' dist/SHA256SUMS)"
          bash scripts/update-homebrew-tap.sh "$version" "$sha256"
