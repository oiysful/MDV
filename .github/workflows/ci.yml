name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI only reads the tree and runs tests, so its GITHUB_TOKEN needs nothing beyond that.
# Without this block the token inherits the repository default, which can be read-write --
# release.yml asks for `contents: write` because it genuinely publishes; this one must not
# carry that just because nobody said otherwise.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Controller tests
        run: npm run test:controller

      - name: Audit dependencies (fail on new high/critical outside accepted risks)
        run: |
          npm audit --audit-level=high --json > audit-full.json || true
          node -e '
            const data = require("./audit-full.json");
            // NOTE: this whole script is a single-quoted shell string, so it must contain
            // no apostrophe anywhere -- one in a comment ends the string and bash runs the
            // remainder (that is exactly how run 35168504489 died on "//: Is a directory").
            //
            // Empty on purpose. brace-expansion and fast-uri sat here from 2026-08-06, when
            // both had highs blocked upstream in the electron-builder dependency tree. Those
            // were resolved by the 2026-08-10 and 2026-09-15 audit fixes, but the entries
            // stayed -- and both packages are still in the tree, so the entries were not
            // stale, they were live suppressions hiding two real packages from this gate.
            // The full tree is at 0 high/critical today, so carrying a suppression buys
            // nothing and costs coverage. Re-add a name only alongside a
            // memory-security.md#accepted_risks entry recording why that advisory cannot
            // be fixed.
            const allowlist = new Set([]);
            const vulns = data.vulnerabilities || {};
            const blocking = Object.entries(vulns).filter(([name, v]) =>
              (v.severity === "high" || v.severity === "critical") && !allowlist.has(name)
            );
            if (blocking.length > 0) {
              console.error("New high/critical vulnerabilities outside the accepted-risk allowlist:");
              for (const [name, v] of blocking) console.error(` - ${name} (${v.severity})`);
              console.error("If newly accepted, add to the allowlist above AND to memory-security.md#accepted_risks together.");
              process.exit(1);
            }
            console.log("No new high/critical vulnerabilities outside memory-security.md#accepted_risks.");
          '

      - name: Audit dependencies (informational, full tree, all severities)
        continue-on-error: true
        run: npm audit

  test-electron:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # `npm ci` alone doesn't always finish downloading the Electron binary (it can defer
      # to a lazy first-require download instead). node --test spawns each test file as its
      # own child process, so with --test-concurrency > 1 several processes would `require('electron')`
      # for the first time at once and race to download+extract into the same node_modules/electron/dist
      # -- this step forces that download to happen exactly once, serially, before any test runs.
      - name: Ensure Electron binary is downloaded
        run: node -e "require('electron')"

      # 4 was a first guess (see AGENTS.md/CONTRIBUTING.md) and proved too aggressive: the
      # first real run finished in ~197s (vs ~30s locally) with 2 timing-sensitive failures
      # (a scroll-restore assertion and a 15s waitForFunction) that don't reproduce locally --
      # both point at CPU contention from 4 concurrent Electron instances on a GitHub-hosted
      # macOS runner's limited cores, not a real bug. Lowered to 2; revisit if CI is still
      # flaky or if it's comfortably fast enough to try raising again later.
      - name: Electron smoke suite
        run: npm run test:electron -- --test-concurrency=2
