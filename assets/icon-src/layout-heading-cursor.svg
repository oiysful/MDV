<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f2f0e8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#c15f3c"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1008" height="1008" rx="228" ry="228" fill="url(#bg)" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect x="8" y="8" width="1008" height="1008" rx="228" ry="228" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" transform="translate(0,-1)"/>

  <!-- heading hierarchy: H1 / H2 / H3 outline bars, near-black -->
  <rect x="150" y="344" width="650" height="110" rx="40" fill="#141413"/>
  <rect x="150" y="508" width="520" height="78" rx="30" fill="#141413"/>
  <rect x="150" y="632" width="390" height="62" rx="26" fill="#141413"/>

  <!-- blinking text cursor at the end of the active (H1) line, brand orange -->
  <rect x="830" y="330" width="36" height="138" rx="18" fill="url(#brand)"/>
</svg>
