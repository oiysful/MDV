<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f2f0e8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#c15f3c"/>
    </linearGradient>
    <filter id="pageShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1008" height="1008" rx="228" ry="228" fill="url(#bg)" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect x="8" y="8" width="1008" height="1008" rx="228" ry="228" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" transform="translate(0,-1)"/>

  <!-- page -->
  <rect x="180" y="150" width="664" height="724" rx="44" fill="#fffdf9" stroke="rgba(0,0,0,0.05)" stroke-width="2" filter="url(#pageShadow)"/>

  <!-- folded corner -->
  <polygon points="714,150 844,150 844,280" fill="url(#bg)"/>
  <polygon points="714,150 844,280 714,280" fill="#eae5d7" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>

  <!-- hash mark -->
  <g transform="translate(250,246) rotate(-8 120 120) scale(0.6)">
    <rect x="78" y="0" width="72" height="332" rx="14" fill="url(#brand)"/>
    <rect x="248" y="0" width="72" height="332" rx="14" fill="url(#brand)"/>
    <rect x="0" y="92" width="398" height="72" rx="14" fill="url(#brand)"/>
    <rect x="0" y="228" width="398" height="72" rx="14" fill="url(#brand)"/>
  </g>

  <!-- text lines -->
  <rect x="250" y="500" width="500" height="56" rx="22" fill="#141413"/>
  <rect x="250" y="592" width="500" height="34" rx="17" fill="#141413"/>
  <rect x="250" y="650" width="390" height="34" rx="17" fill="#141413"/>
</svg>
